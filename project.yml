name: Taki
options:
  bundleIdPrefix: com.abiodunosagie
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # To build your own copy, change these two lines: your team ID and your reverse-DNS prefix.
    DEVELOPMENT_TEAM: 6989F7G8CN
    TAKI_BUNDLE_PREFIX: com.abiodunosagie
    TAKI_APP_GROUP: $(DEVELOPMENT_TEAM).$(TAKI_BUNDLE_PREFIX).Taki
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0
targets:
  Taki:
    type: application
    platform: macOS
    sources:
      - path: Taki
      - path: Free
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAKI_BUNDLE_PREFIX).Taki
        PRODUCT_NAME: Taki
        INFOPLIST_FILE: Taki/Resources/Info.plist
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: Taki/Resources/Taki.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TakiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TakiTests
    dependencies:
      - target: Taki
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Taki.app/Contents/MacOS/Taki
schemes:
  Taki:
    build:
      targets:
        Taki: all
        TakiTests: [test]
    test:
      targets:
        - TakiTests
